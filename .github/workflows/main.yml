name: Analyze Code

on:
  schedule:
    - cron: 0 2 * * *
  workflow_dispatch:

jobs:
  run:
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4
      - run: |
          rm -rf /tmp/zephyr_epsu
          git clone --depth 1 https://github.com/hfgdwuyi/zephyr_epsu.git /tmp/zephyr_epsu
          python3 -m venv .venv
          .venv/bin/pip install requests
      - run: .venv/bin/python analyze.py --target /tmp/zephyr_epsu
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results
          path: |
            analysis-results.json
            analysis-report.md
