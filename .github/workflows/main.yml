name: Analyze Code

on:
  workflow_dispatch:
  schedule:
    - cron: 0 2 * * *

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: 3.11
      - run: pip install requests
      - run: python3 analyze.py
      - uses: actions/upload-artifact@v3
        if: always()
        with:
          name: results
          path: analysis-*.{json,md}
