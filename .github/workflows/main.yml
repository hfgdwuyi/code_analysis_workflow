name: Analyze Code

on:
  schedule:
    - cron: 0 2 * * *
  workflow_dispatch:

jobs:
  run:
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4
      - run: pip3 install requests
      - run: python3 analyze.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results
          path: |
            analysis-results.json
            analysis-report.md
