name: Code Analysis with Ollama

on:
  workflow_dispatch:
    inputs:
      ollama_host:
        description: 'Ollama server address'
        required: false
        default: 'http://localhost:11434'
      model:
        description: 'Model to use'
        required: false
        default: 'deepseek-coder:6.7b'
  schedule:
    - cron: '0 2 * * *'

jobs:
  analyze-code:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -q requests

      - name: Run code analysis
        env:
          OLLAMA_HOST: ${{ github.event.inputs.ollama_host || 'http://localhost:11434' }}
          MODEL: ${{ github.event.inputs.model || 'deepseek-coder:6.7b' }}
        run: python3 analyze.py --host "$OLLAMA_HOST" --model "$MODEL"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: analysis-results
          path: |
            analysis-results.json
            analysis-report.md
          retention-days: 30

      - name: Create summary
        if: github.event_name == 'workflow_dispatch' && always()
        run: |
          echo "## Code Analysis Results" >> "$GITHUB_STEP_SUMMARY"
          if [ -f analysis-report.md ]; then
            echo "✅ Analysis completed!" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            head -50 analysis-report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "⚠️ Analysis could not complete" >> "$GITHUB_STEP_SUMMARY"
          fi
