name: Code Analysis with Ollama

on:
  workflow_dispatch:
    inputs:
      ollama_host:
        description: 'Ollama server address (e.g., http://localhost:11434)'
        required: false
        default: 'http://localhost:11434'
      model:
        description: 'Model to use (default: deepseek-coder:6.7b)'
        required: false
        default: 'deepseek-coder:6.7b'
  schedule:
    - cron: '0 2 * * *'  # Daily at 2 AM UTC

jobs:
  analyze-code:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install -q requests
      
      - name: Test Ollama connection
        env:
          OLLAMA_HOST: ${{ github.event.inputs.ollama_host || 'http://localhost:11434' }}
          MODEL: ${{ github.event.inputs.model || 'deepseek-coder:6.7b' }}
        run: |
          python3 << 'EOF'
          import requests
          import os
          import sys
          
          ollama_host = os.getenv('OLLAMA_HOST', 'http://localhost:11434')
          model = os.getenv('MODEL', 'deepseek-coder:6.7b')
          
          try:
              response = requests.get(f"{ollama_host}/api/tags", timeout=5)
              if response.status_code == 200:
                  print(f"✓ Connected to Ollama at {ollama_host}")
                  models = response.json().get('models', [])
                  model_names = [m['name'] for m in models]
                  print(f"Available models: {model_names}")
                  if any(model in name for name in model_names):
                      print(f"✓ Model {model} is available")
                  else:
                      print(f"⚠ Model {model} not found. Available: {model_names}")
              else:
                  print(f"✗ Failed to connect: {response.status_code}")
                  sys.exit(1)
          except Exception as e:
              print(f"✗ Error connecting to Ollama: {e}")
              sys.exit(1)
          EOF
      
      - name: Analyze code files
        env:
          OLLAMA_HOST: ${{ github.event.inputs.ollama_host || 'http://localhost:11434' }}
          MODEL: ${{ github.event.inputs.model || 'deepseek-coder:6.7b' }}
        run: |
          python3 << 'EOF'
          import os
          import requests
          import json
          from pathlib import Path
          import time
          
          OLLAMA_HOST = os.getenv('OLLAMA_HOST', 'http://localhost:11434')
          MODEL = os.getenv('MODEL', 'deepseek-coder:6.7b')
          
          # Supported code file extensions
          CODE_EXTENSIONS = {
              '.py': 'Python',
              '.js': 'JavaScript',
              '.ts': 'TypeScript',
              '.jsx': 'JSX',
              '.tsx': 'TSX',
              '.java': 'Java',
              '.cpp': 'C++',
              '.c': 'C',
              '.go': 'Go',
              '.rs': 'Rust',
              '.php': 'PHP',
              '.rb': 'Ruby',
              '.sh': 'Shell',
              '.yaml': 'YAML',
              '.yml': 'YAML',
              '.json': 'JSON',
              '.xml': 'XML',
              '.html': 'HTML',
              '.css': 'CSS',
              '.sql': 'SQL',
          }
          
          def get_code_files():
              """Find all code files in the repository."""
              files = []
              exclude_dirs = {'.git', '.github', 'node_modules', '__pycache__', '.venv', 'venv', 'dist', 'build'}
              
              for root, dirs, filenames in os.walk('.'):
                  # Remove excluded directories
                  dirs[:] = [d for d in dirs if d not in exclude_dirs]
                  
                  for filename in filenames:
                      ext = Path(filename).suffix.lower()
                      if ext in CODE_EXTENSIONS:
                          filepath = os.path.join(root, filename)
                          files.append(filepath)
              
              return sorted(files)
          
          def analyze_file(filepath):
              """Analyze a single file using Ollama."""
              try:
                  with open(filepath, 'r', encoding='utf-8', errors='ignore') as f:
                      content = f.read()
                  
                  # Skip very large files
                  if len(content) > 50000:
                      return {
                          'status': 'skipped',
                          'reason': f'File too large ({len(content)} chars)',
                          'size': len(content)
                      }
                  
                  prompt = f"""Please analyze this code file:
          
          File: {filepath}
          Language: {CODE_EXTENSIONS.get(Path(filepath).suffix.lower(), 'Unknown')}
          
          Code:
          ```
          {content}
          ```
          
          Provide analysis in the following format:
          1. **Purpose**: What does this code do?
          2. **Key Components**: Main functions/classes and their roles
          3. **Dependencies**: External libraries and dependencies
          4. **Issues**: Any potential issues, improvements, or concerns
          5. **Summary**: Brief 1-2 sentence summary
          """
          
                  response = requests.post(
                      f"{OLLAMA_HOST}/api/generate",
                      json={
                          "model": MODEL,
                          "prompt": prompt,
                          "stream": False,
                          "temperature": 0.1,
                      },
                      timeout=120
                  )
                  
                  if response.status_code == 200:
                      return {
                          'status': 'success',
                          'analysis': response.json()['response'],
                          'size': len(content)
                      }
                  else:
                      return {
                          'status': 'error',
                          'error': f'HTTP {response.status_code}'
                      }
              
              except Exception as e:
                  return {
                      'status': 'error',
                      'error': str(e)
                  }
          
          # Get all code files
          code_files = get_code_files()
          print(f"\n📊 Found {len(code_files)} code files to analyze\n")
          
          if not code_files:
              print("⚠ No code files found!")
              exit(0)
          
          results = {}
          summary_stats = {
              'total': len(code_files),
              'analyzed': 0,
              'skipped': 0,
              'errors': 0
          }
          
          # Analyze each file
          for i, filepath in enumerate(code_files, 1):
              print(f"[{i}/{len(code_files)}] Analyzing {filepath}...", end=" ", flush=True)
              
              result = analyze_file(filepath)
              results[filepath] = result
              
              if result['status'] == 'success':
                  summary_stats['analyzed'] += 1
                  print("✓")
              elif result['status'] == 'skipped':
                  summary_stats['skipped'] += 1
                  print(f"⊘ ({result['reason']})")
              else:
                  summary_stats['errors'] += 1
                  print(f"✗ ({result.get('error', 'Unknown error')})")
              
              time.sleep(0.5)  # Rate limiting
          
          # Save detailed results
          with open('analysis-results.json', 'w') as f:
              json.dump(results, f, indent=2, ensure_ascii=False)
          
          # Generate markdown report
          report = f"""# Code Analysis Report

Generated: {time.strftime('%Y-%m-%d %H:%M:%S')}
Model: {MODEL}
Ollama Server: {OLLAMA_HOST}

## Summary Statistics

- **Total Files Analyzed**: {summary_stats['analyzed']}
- **Skipped Files**: {summary_stats['skipped']}
- **Errors**: {summary_stats['errors']}
- **Total Files Found**: {summary_stats['total']}

## Detailed Analysis

"""
          
          for filepath, result in results.items():
              report += f"\n---\n\n### {filepath}\n\n"
              
              if result['status'] == 'success':
                  report += result['analysis']
              elif result['status'] == 'skipped':
                  report += f"⊘ **Skipped**: {result['reason']}\n"
              else:
                  report += f"✗ **Error**: {result.get('error', 'Unknown error')}\n"
          
          # Add workflow summary
          report += f"""

---

## Workflow Summary

This analysis was performed using:
- **Model**: {MODEL}
- **Server**: {OLLAMA_HOST}
- **Files Analyzed**: {summary_stats['analyzed']}
- **Success Rate**: {(summary_stats['analyzed'] / summary_stats['total'] * 100):.1f}%

### Key Insights

The analysis covered {summary_stats['analyzed']} code files, providing insights into:
- Code purpose and functionality
- Key components and architecture
- Dependencies and external libraries
- Potential improvements and issues
- Concise summaries for each file

All detailed results are available in `analysis-results.json`.
"""
          
          with open('analysis-report.md', 'w') as f:
              f.write(report)
          
          print("\n\n✅ Analysis complete!")
          print(f"   Results saved to: analysis-results.json")
          print(f"   Report saved to: analysis-report.md")
          EOF
      
      - name: Upload analysis results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: analysis-results
          path: |
            analysis-results.json
            analysis-report.md
          retention-days: 30
      
      - name: Comment on workflow
        if: github.event_name == 'workflow_dispatch' && always()
        run: |
          echo "## Code Analysis Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f analysis-report.md ]; then
            echo "✅ Analysis completed successfully!" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Report Preview" >> $GITHUB_STEP_SUMMARY
            head -50 analysis-report.md >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "📄 Full report available in Artifacts" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ Analysis could not be completed" >> $GITHUB_STEP_SUMMARY
          fi
